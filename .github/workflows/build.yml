name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    name: C++ (MSBuild)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build backpack.dll
        run: msbuild src/backpack.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Upload backpack.dll
        uses: actions/upload-artifact@v4
        with:
          name: native
          path: src/x64/Release/backpack.dll

  viewer:
    name: C# Viewer + Installer
    runs-on: windows-latest
    needs: native
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish viewer
        working-directory: viewer
        run: dotnet publish viewer.csproj -c Release -p:Platform=x64 --nologo -o ../publish

      - name: Download backpack.dll
        uses: actions/download-artifact@v4
        with:
          name: native
          path: src/x64/Release

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Ensure ChineseSimplified.isl
        run: |
          $dest = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          if (-not (Test-Path $dest)) {
            $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $dest
          }
      - name: Build installer
        working-directory: src/installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss /Ooutput'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: src/installer/output/*.exe
