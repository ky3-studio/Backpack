name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    name: C++ (MSBuild)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build backpack.dll
        run: msbuild backpack.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal

  viewer:
    name: C# Viewer (dotnet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build viewer
        working-directory: viewer
        run: dotnet build viewer.csproj -c Release -p:Platform=x64 --nologo
